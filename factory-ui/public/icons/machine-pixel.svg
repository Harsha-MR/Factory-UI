<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 96">
  <defs>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5ebee"/>
      <stop offset="1" stop-color="#cfd8dd"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2a31"/>
      <stop offset="1" stop-color="#2d3b43"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#708087"/>
      <stop offset="1" stop-color="#4a5a61"/>
    </linearGradient>
  </defs>

  <!-- machine base -->
  <rect x="16" y="76" width="96" height="14" rx="2" fill="url(#base)"/>
  <rect x="20" y="74" width="8" height="2" fill="#ef4444"/>
  <rect x="100" y="74" width="8" height="2" fill="#ef4444"/>

  <!-- body -->
  <rect x="12" y="26" width="44" height="50" rx="2" fill="url(#cab)" stroke="#7a8a91" stroke-width="1.5"/>
  <rect x="56" y="28" width="44" height="48" rx="2" fill="url(#cab)" stroke="#7a8a91" stroke-width="1.5"/>
  <rect x="46" y="38" width="20" height="38" fill="#5c6c73"/>

  <!-- window chamber -->
  <rect x="46" y="30" width="36" height="40" fill="url(#inner)" stroke="#2f3d44" stroke-width="1.5"/>
  <rect x="50" y="34" width="28" height="26" fill="#2a363d"/>
  <rect x="52" y="52" width="24" height="8" fill="#d5dbe0"/>
  <line x1="52" y1="55" x2="76" y2="55" stroke="#96a2a8" stroke-width="1"/>

  <!-- spindle -->
  <rect x="58" y="8" width="12" height="28" fill="#7b8f92"/>
  <rect x="56" y="6" width="16" height="4" fill="#86999c"/>
  <rect x="61" y="35" width="6" height="8" fill="#c5ced3"/>
  <circle cx="64" cy="44" r="2.5" fill="#e5e7eb"/>

  <!-- side pipe -->
  <path d="M12 70 L2 80 L8 86 L18 76 Z" fill="#6b7b82"/>

  <!-- control panel -->
  <rect x="80" y="44" width="18" height="24" rx="1.5" fill="#aeb9bf" stroke="#4f5f66" stroke-width="1.2"/>
  <rect x="82" y="46" width="14" height="10" rx="1" fill="#dbe2e6"/>
  <rect x="83" y="59" width="2.5" height="2.5" fill="#84cc16"/>
  <rect x="87" y="59" width="2.5" height="2.5" fill="#84cc16"/>
  <rect x="91" y="59" width="2.5" height="2.5" fill="#eab308"/>
  <rect x="83" y="63" width="2.5" height="2.5" fill="#475569"/>
  <rect x="87" y="63" width="2.5" height="2.5" fill="#475569"/>
  <rect x="91" y="63" width="2.5" height="2.5" fill="#f59e0b"/>

  <!-- indicators -->
  <rect x="28" y="78" width="6" height="5" fill="#facc15"/>
  <circle cx="94" cy="80.5" r="2.5" fill="#ef4444"/>
</svg>
